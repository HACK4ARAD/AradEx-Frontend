# Deploy web (prezentare + panouri) pe AWS la push pe main: teste + build Vite web + verificare -> imagine nginx în ECR -> ECS (rolling, rollback automat).
# Acces AWS cu cheile utilizatorului IAM aradex-gha-frontend (secretele repo-ului AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY, puse de AradEx-Infrastructure/scripts/github-keys.sh; organizația AWS nu permite OIDC).
# URL-ul API vine din SSM (/aradex/web/api_url), scris de AradEx-Infrastructure/terraform. Imaginea: deploy/Dockerfile.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: aradex-web
  ECS_CLUSTER: aradex
  ECS_SERVICE: aradex-web
  TASK_FAMILY: aradex-web
  CONTAINER_NAME: web

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read API URL from SSM
        run: echo "VITE_API_URL=$(aws ssm get-parameter --name /aradex/web/api_url --query Parameter.Value --output text)" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          VITE_DEMO: "true"
      # web-ul nu are voie să conțină nimic din aplicația mobilă (build separat, `npm run build:mobile`)
      - run: npm run check:web

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -f deploy/Dockerfile -t "$image" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$image"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Current task definition
        run: aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

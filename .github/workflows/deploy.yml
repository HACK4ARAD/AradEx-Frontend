# Deploy PWA pe AWS la push pe main: teste + build Vite -> S3 -> invalidare CloudFront.
# Acces AWS prin OIDC (fără chei în GitHub). Bucket-ul, distribuția și URL-ul API vin din SSM (/aradex/web/*),
# scrise de AradEx-Infrastructure/terraform.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::712710404828:role/aradex-gha-frontend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deploy config from SSM
        run: |
          get() { aws ssm get-parameter --name "/aradex/web/$1" --query Parameter.Value --output text; }
          {
            echo "BUCKET=$(get bucket)"
            echo "DISTRIBUTION_ID=$(get distribution_id)"
            echo "VITE_API_URL=$(get api_url)"
          } >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          VITE_DEMO: "true"

      - name: Upload to S3
        run: |
          # Fișierele cu hash: cache lung, fără ștergere (tab-urile deschise le mai cer).
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          # Restul (img, fonturi, icon-uri): cache scurt; fișierele PWA critice se urcă separat, mai jos.
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "assets/*" --exclude "index.html" --exclude "sw.js" --exclude "registerSW.js" \
            --exclude "manifest.webmanifest" --exclude "workbox-*.js" \
            --cache-control "public, max-age=3600"
          # PWA: fără cache, ca update-ul să ajungă imediat.
          for f in index.html sw.js registerSW.js; do
            if [ -f "dist/$f" ]; then aws s3 cp "dist/$f" "s3://$BUCKET/$f" --cache-control "no-cache"; fi
          done
          if [ -f dist/manifest.webmanifest ]; then
            aws s3 cp dist/manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" \
              --cache-control "no-cache" --content-type "application/manifest+json"
          fi
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude "*" --include "workbox-*.js" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text

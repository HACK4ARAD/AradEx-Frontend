# Web-ul AradExperience (prezentare + panouri; build-ul `npm run build`) în spatele ALB-ului (HTTPS se termină pe ALB;
# /api/* merge direct la API, nu trece pe aici). Aplicația mobilă e un build separat, doar în Capacitor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check-ul ALB-ului.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fișierele cu hash din build: cache lung.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fără cache, ca o versiune nouă să ajungă imediat (inclusiv index.html servit pentru rutele SPA). sw.js e service
    # worker-ul care se șterge singur (web-ul nu mai e PWA); trebuie să ajungă proaspăt la browserele cu PWA-ul vechi.
    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Restul (img, fonturi, icon-uri): cache scurt. Rutele SPA (/city/..., /business/...) cad pe index.html.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }
}

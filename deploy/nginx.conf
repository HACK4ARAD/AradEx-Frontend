# PWA AradExperience în spatele ALB-ului (HTTPS se termină pe ALB; /api/* merge direct la API, nu trece pe aici).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Health check-ul ALB-ului.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fișierele cu hash din build: cache lung.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA: fără cache, ca o versiune nouă să ajungă imediat (inclusiv index.html servit pentru rutele SPA).
    location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Manifestul PWA: tipul corect (mime.types implicit nu are .webmanifest; un bloc `types` la nivel de server
    # ar înlocui toate tipurile) și fără cache.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Restul (img, fonturi, icon-uri): cache scurt. Rutele SPA (/m/..., /w/...) cad pe index.html.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }
}
